name: Release
# Builds + signs Windows + Mac binaries on every `v*` tag, attaches
# them to a GitHub Release, and updates the `latest.json` the Tauri
# updater plugin polls. Driven by tauri-apps/tauri-action which
# bundles the right CLI commands per platform.
#
# To cut a release:
#   1. Bump the "version" field in src-tauri/tauri.conf.json AND
#      package.json (keep them in sync)
#   2. Commit + push
#   3. Tag: `git tag v0.2.0 && git push origin v0.2.0`
#   4. Wait ~10 min for both runners to finish
#   5. Edit the generated draft release (add notes), then publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write           # Needed to create the release + upload artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: ''
            label: 'Windows'
          # macOS is disabled until Apple Developer signing/notarization
          # is set up — without a cert the build fails every release.
          # Re-enable by uncommenting + adding the signing secrets.
          # - platform: 'macos-latest'
          #   target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          #   label: 'macOS (Intel + Apple Silicon)'
          # Linux later if needed:
          # - platform: 'ubuntu-22.04'
          #   target: ''
          #   label: 'Linux'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: npm install
        run: npm install

      - name: Tauri build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key. Generated once via
          # `npm run tauri signer generate -- -w ~/.tauri/vista.key`.
          # Stored as a GitHub repo secret. Without these the build
          # still succeeds but the bundle won't include the .sig files
          # the updater needs, so users can't auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vista Platform ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG for what changed.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
