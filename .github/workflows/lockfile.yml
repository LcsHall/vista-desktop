name: Refresh Cargo.lock
# Generates src-tauri/Cargo.lock on the same runner the release builds on,
# proves the app compiles with it (cargo check --locked), and commits it.
# Manual only (Actions → Refresh Cargo.lock → Run workflow, or
# `gh workflow run lockfile.yml`). Owner-approved 2026-09-28.
#
# Why: Cargo.lock was gitignored, so every release re-resolved `tauri = "2"`
# and its plugins fresh — no build was reproducible and a minor bump could
# change behaviour with no diff. Once committed, release builds use exactly
# these versions until this workflow is run again on purpose.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate the lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      # Pin the Tauri stack to exactly what v0.2.7 (the installed release) was
      # built with — read from its release log (run 31538023885). The newest
      # tauri/wry now pull webview2-com 0.39 while lib.rs uses 0.38 directly,
      # so a fresh resolve no longer compiles (found 2026-09-28). Moving past
      # these is a deliberate upgrade: bump them here AND webview2-com/windows
      # in Cargo.toml together.
      - name: Pin the Tauri stack to the v0.2.7 build
        working-directory: src-tauri
        shell: bash
        run: |
          # Every Tauri-family crate v0.2.7 was built with. Each crate's newer
          # release needs a newer version of another, so no single order works:
          # retry in rounds (a pin that can't land yet is skipped this round),
          # then require every one to be exact.
          SPECS="tauri-plugin-dialog@2.7.2 tauri-plugin-updater@2.10.1 tauri-plugin-fs@2.5.1
                 tauri-plugin@2.6.3 tauri@2.11.5 tauri-runtime-wry@2.11.4 tauri-runtime@2.11.3
                 tauri-build@2.6.3 tauri-codegen@2.6.3 tauri-macros@2.6.3 tauri-utils@2.9.3
                 tauri-winres@0.3.6 wry@0.55.1 tao@0.35.3 muda@0.19.3 tray-icon@0.24.2
                 webview2-com@0.38.2 webview2-com-sys@0.38.2 webview2-com-macros@0.8.1"
          locked() { awk -v n="$1" '$0=="[[package]]"{p=""} $1=="name"{p=$3} $1=="version"&&p=="\""n"\""{gsub(/"/,"",$3);print $3}' Cargo.lock; }
          for round in 1 2 3 4 5 6 7 8; do
            left=0
            for spec in $SPECS; do
              name=${spec%@*}; ver=${spec#*@}
              if locked "$name" | grep -qx "$ver" && [ "$(locked "$name" | wc -l)" -eq 1 ]; then continue; fi
              left=$((left+1))
              cargo update -p "$name" --precise "$ver" >/dev/null 2>&1 || true
            done
            echo "round $round: $left not yet pinned"
            [ "$left" -eq 0 ] && break
          done
          bad=0
          for spec in $SPECS; do
            name=${spec%@*}; ver=${spec#*@}
            got=$(locked "$name" | tr '\n' ' ')
            if [ "$got" != "$ver " ]; then echo "NOT PINNED: $name wants $ver, lockfile has: $got"; bad=1; fi
          done
          exit $bad

      - name: The app compiles with exactly these versions
        working-directory: src-tauri
        run: cargo check --locked

      - name: Track Cargo.lock
        shell: bash
        run: |
          sed -i '/^src-tauri\/Cargo\.lock$/d' .gitignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Cargo.lock: pin the Rust dependency versions (Refresh Cargo.lock workflow)"
          git push origin HEAD:${GITHUB_REF_NAME}
