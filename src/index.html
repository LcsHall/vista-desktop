<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vista Platform</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!--
    Custom title bar. The brand area + the flexible spacer are Tauri drag
    regions (data-tauri-drag-region) so the user can grab them to move the
    window. The tab strip and the window-control buttons are interactive
    and deliberately are NOT drag regions.
  -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar__brand" data-tauri-drag-region>
      <!-- Real Vista sail mark, served locally from this src/ dir. -->
      <img class="titlebar__logo" src="./logo.png" alt="Vista" draggable="false" />
    </div>

    <!-- Tab strip. Populated by main.js: a fixed "Platform" tab plus one
         tab per opened /manage/* page (POS, Messaging, …). -->
    <div class="titlebar__tabs" id="tabs"></div>

    <!-- Flexible drag region between the tabs and the window controls. -->
    <div class="titlebar__spacer" data-tauri-drag-region></div>

    <!--
      Window controls. Order matches Windows convention: minimize,
      maximize, close. These are click targets (no drag-region attribute),
      so Tauri lets their click handlers run instead of starting a drag.
    -->
    <div class="titlebar__controls">
      <button class="titlebar__btn" id="btn-min" aria-label="Minimize" title="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
      <button class="titlebar__btn" id="btn-max" aria-label="Maximize" title="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" id="icon-max">
          <rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" id="icon-restore" style="display:none">
          <rect x="2" y="3" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M3 3 V1 H9 V7 H7" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
      <button class="titlebar__btn titlebar__btn--close" id="btn-close" aria-label="Close" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/>
          <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>

    <!--
      Call-guard confirm strip. Hidden until Rust emits call:close-blocked
      (the user tried to close the window or the Phone tab during a live
      call). Overlays the whole title bar; "Close anyway" force-closes and
      hangs up, anything else keeps the call.
    -->
    <div class="callguard" id="callguard" role="alertdialog" aria-live="assertive" style="display:none">
      <span class="callguard__dot" aria-hidden="true"></span>
      <span class="callguard__msg" id="callguard-msg">Call in progress — closing will hang up.</span>
      <button class="callguard__btn callguard__btn--keep" id="callguard-keep">Keep call</button>
      <button class="callguard__btn callguard__btn--close" id="callguard-close">Close anyway</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
