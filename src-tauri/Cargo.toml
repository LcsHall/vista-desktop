[package]
name = "vista-platform"
version = "0.2.6"
description = "Vista Platform desktop app"
authors = ["Vista Interface"]
edition = "2021"

[lib]
name = "vista_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core — pick the runtime backend at compile time. tray-icon
# enables the optional system-tray feature; remove the feature flag
# if we decide not to ship a tray icon. `unstable` exposes the
# multi-webview API (WindowBuilder + WebviewBuilder + Window::add_child
# / get_webview) that this shell's title-bar + content split relies on;
# it is NOT in the stable single-webview (WebviewWindow) surface.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
# Updater — fetches the GitHub Releases manifest configured in
# tauri.conf.json and installs signed updates. NOTE: the v2 plugin
# never checks on its own — spawn_update_check() in lib.rs drives it
# (the old `"dialog": true` config was a Tauri v1 relic the v2 plugin
# ignored, which left every install from 0.1.0-0.1.3 frozen). The
# signing keypair is generated separately via `npm run tauri signer
# generate`; the private half lives in CI secrets, the public half
# goes into tauri.conf.json's plugins.updater.pubkey field.
tauri-plugin-updater = "2"
# Native message dialog for the update prompt.
tauri-plugin-dialog = "2"
# Serde for any IPC payloads (window state, etc).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opens URLs in the user's default browser. Used by the content
# webview's new-window handler so target="_blank" / window.open links
# (the sidebar's "View Booking Site" + "VISTA Consulting", etc.) leave
# the chromeless app and open in a real browser instead. Called purely
# from Rust, so it needs no Tauri capability/permission grant.
open = "5"

# Raw WebView2 COM surface for the softphone's mic auto-grant (a
# PermissionRequested handler — wry only registers its own handler for
# clipboard-read, so Microphone is ours to decide). Versions pinned to
# match what tauri 2.x / wry already pull in so we share the exact same
# COM types (proven in the 2026-07-19 ccp-spike).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Win32_System_Power = SetThreadExecutionState (hold the machine awake DURING a
# live call so it can't sleep mid-call; released the moment the call ends).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }

[features]
# This feature is used for production builds or when a dev server is
# not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
